<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>

</head>

<body>
    <h2>This is HTML forms tutorial</h2>
    <form action="backend.php">
        <label for="name"> Name</label>
        <div>
            name: <input type="text" name="myname" id="name">
        </div>
        <br>
        <div>
            Role: <input type="text" name="myRole">
        </div>
        <br>
        <div>
            email: <input type="email" name="myEmail">
        </div>
        <br>

        <div>
            Date: <input type="date" name="myDate">
        </div>
        <br>
        <div>
            Bonus: <input type="number" name="myNumber">
        </div>
        <br>
        <div>
            Are You eliigible: <input type="checkbox" name="myEligibilty" checked>
        </div>
        <br>
        <div>
            Gender: Male <input type="radio" name="myGender"> female <input type="radio" name="myGender"> other <input
                type="radio" name="myGender">
            <br>
            <div>
                <input type="submit" value="Submit Now">
                <input type="reset" value="reset now">
            </div>
            <div>
                write about yourself: <br> <textarea name="myText" id="" cols="30" rows="10"></textarea>
            </div>
            <br>
            <div>
                <label for="car">Car</label>
                <select name="myCar" id="car">
                    <option value="ind">Indica</option>
                    <option value="swf">Swift</option>
                    <option value="bol">Bolero</option>
                </select>
            </div>
            <br>
    </form>


</body>

</html>
