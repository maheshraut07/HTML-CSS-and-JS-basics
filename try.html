<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(202, 248, 248);
            height: 100vh;
            width: 100vw;
            
        }
        .mahi{
            border-radius: 10px;
            padding: 34px 34px ;
            margin: 20px 20px;
            border: 2px solid black;
        }
        .container{
            display: inline-block;
            position: absolute;
            display: flex;
            flex-direction: column;
            
            width: 100%;
            height: 100%;
            border-radius: 3;

        }
        #box-1{
            background-color: rgb(161, 94, 35);
            width: 80px;
            height: 151px;
           

        }
        #box-2{
            background-color: blue;
            position: absolute;
            width: 80px;
            top: 481px;
            float: left;
            height: 151px;

        }
        #box-3{
            background-color: blueviolet;
            width: 80px;
            position: absolute;
            float: right;
            top: 481px ;
            right: 0px;
            height: 151px;

        }
        #box-4{

            background-color: purple;
            position: absolute;
            left: 600px;
            top: 250px;
            width: 200px;
            height: 200px;


        }
        #box-5{
            
            background-color: palevioletred;
            position: absolute;
            right: 0px;
            width: 80px;
            height: 151px;

        }
    </style>
</head>

<body>
    <div class="container">
        <div id="box-1" class="mahi"></div>
        <div id="box-2" class="mahi"></div>
        <div id="box-3" class="mahi"></div>
        <div id="box-4" class="mahi"></div>
        <div id="box-5" class="mahi"></div>
    </div>

</body>

</html>
