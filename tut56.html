<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulating DOM</title>  
</head>
<body>
    <div id="main" class="container">
        <ul id="nav">
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>More about us</li>
            <li>Contact us</li>
        </ul>
    </div>
    <button type="button" onclick="myfunc()" >click me</button>
    <script>
        // DOM = Document object Model

        let main = document.getElementById('main'); // by this syntax we can change the html inside id main
        console.log(main);

        let nav = document.getElementById('nav'); // by this syntax we can change the html inside id 'nav'
        console.log(nav);

        let sel = document.querySelector('.container');  // by this we can access different selectors
        console.log(sel);
          
    
        function myfunc()
        {
            document.write("mahesh");
        };
        
    </script>

    
</body>
</html>
