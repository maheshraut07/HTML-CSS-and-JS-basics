<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Units(in responsive website )</title>
    <style>
        html{
            font-size: 25px;
        }
        .container{
            font-size: 10px;
            
        }

        h1{
            text-align: center;
        }

        #first{
            font-size: 3em;
        }
        #second{
            font-size: 3rem;
        }
    </style>
</head>
<body>
   <div class="container">
   <h1 id="first">This is my heading</h1>
   <h1 id="second">This is my heading</h1>
   <h1 id="third">This is my heading</h1>
   
   </div>
    
</body>
</html>


<!--**em property
if we set "n em "font size in a style of an elment it will take n times of parent font size 

**rem property
if we set "n rem "font size in a style of an element it will take n times of style of html selector's font size

***height = 50vh ( 50% of viewport height)
***width - 70vw  (70% of viewport width)-->
