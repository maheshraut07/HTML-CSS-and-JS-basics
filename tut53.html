<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Functions in javascript </title>
</head>

<body>
    <div class="container">
        This is container
    </div>
    <script>
        console.log("this is tuturial of javscript")
        function simple(name) {                   //does not return any value
            console.log(name + " is a good boy");
        }
        let name1 = "mahesh";
        let name2 = "vicky";
        let name3 = "sumit";
        let name4 = "darshan";
        simple(name1);
        simple(name2);
        simple(name3);
        simple(name4);


        function sum(a, b, c) {             // return something value
            d = a + b + c;
            return d;

        }

        let returnValue = sum(1, 2, 3);
        console.log(returnValue);
    </script>
</body>

</html>
