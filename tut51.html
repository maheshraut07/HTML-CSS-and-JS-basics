<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope and Conditionals</title>
</head>
<body>
    <div>
        <ul>
            <li>Item-1</li>
            <li>Item-2</li>
            <li>Item-3</li>
            <li>Item-4</li>
            <li>Item-5</li>
            <li>Item-6</li>
            <li>Item-7</li>
        </ul>
    </div>
    <script>
        // if else statements in javascript
        let age = 34;
        if(age>18){
            console.log("you can drink water");
        }
        else {
            console.log("you can drink cold drink");
        }


        // switch case in javascript
        const cups = 45;
        switch(cups){
            case 4:
            console.log("the value of cups is 4");
            break;

            case 5:
            console.log("the value of cups is 5");
            break;

            case 6:
            console.log("the value of cups is 6");
            break;

            default:
            break;

        }
          
    </script>
    
</body>
</html>
