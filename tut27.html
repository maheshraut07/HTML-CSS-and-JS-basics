<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility and z-index </title>
    <style>
        #box1 {
            position: relative;
            width: 150px;
            height: 150px;
            top: 50px;
            background-color: red;
            z-index: 2;
        }
        #box2 {
            position: relative;
            width: 150px;
            height: 150px;
            top: 10px;
            background-color: green;
            z-index: 1;   /* z-index will work ony for position : relative , absolute, fixed or sticky;
                                css of elment which has higher z-index will diplay on top*/

        }
        #box3 {
            /*display: none; 
              will hide the element and the space*/
            width: 150px;
            height: 150px;
            background-color: yellow;
        }
        #box4 {
            /*visibility: hidden;
              will hide the element but will show its empty space*/
            width: 150px;
            height: 150px;
            background-color: blue;
        }
        #box5 {
            width: 150px;
            height: 150px;
            background-color: orange;
        }
    </style>
</head>

<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
    <div class="box" id="box5"></div>
</body>

</html>
