<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Object</title>

</head>
<body>
    <div class="container">
        <h1>This is math object Tutorial</h1>
    </div>
    <script>
        let m = Math;
        console.log(m);

        // Printing the constants  from math object
        console.log("the value of Math.E is ", Math.E);
        console.log("the value of Math.PI is ", Math.PI);
        console.log("the value of Math.LN2 is ", Math.LN2);
        

        // printing the functions from math Objet
        let a = 34.64534;
        let b = 89;

        console.log("The value of a and b is ", a,"and",b);
        console.log("the value of a and b rounded is ",Math.round(a),Math.round(b));

        console.log("3 raised to the power of 2 is",Math.pow(2,3));

        console.log("5.8 rounded up to nearest integer is ",Math.ceil(5.8));
        console.log("5.8 rounded down to nearest integer is ",Math.floor(5.8));

        /*there are various functions such as
         1 . abs()
         2. min()
         3. max()
         */

         console.log("the value of sin(pi) is "+Math.sin(Math.PI/2));

         // function to generate random numbers

         let r = Math.random();
         console.log("The random number is ",r);

         let a1 = 1;
         let b1 = 100;
         let r1_100 = a1 + (b1-a1)*Math.random();
         console.log("The random number is ",r1_100);

         console.log("this is the code for the random number between 1 and 100 ")
         console.log(Math.round( 1 + (100-1) * Math.random()))



    </script> 
    
</body>
</html>
