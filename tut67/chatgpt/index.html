<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Clone</title>
  <!-- Include CSS stylesheets -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Spotify Clone</h1>
  </header>
  <main>
    <div id="now-playing">
      <h2>Now Playing: </h2>
      <p id="song-title">Song Title</p>
      <p id="artist">Artist</p>
    </div>
    <div id="playlist">
      <h2>Playlist</h2>
      <ul id="song-list">
        <li>Song 1</li>
        <li>Song 2</li>
        <li>Song 3</li>
        <!-- Add more songs dynamically using JavaScript -->
      </ul>
    </div>
  </main>
  <footer>
    <p>&copy; 2023 Spotify Clone. All rights reserved.</p>
  </footer>

  <!-- Include JavaScript libraries/frameworks -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.2.20/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Include your custom JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
