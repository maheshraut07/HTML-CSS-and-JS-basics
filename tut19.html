<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> html border</title>
    <style> 
        #firstpara{
           border: 2px solid yellow;
            height: auto;
            width: auto;
            padding: 20px;
      
            border-style: dotted;
            border-radius: 11px;
        }
        #secondpara{
            border-top: 2px solid rgb(rgb(144, 0, 255), green, blue);
        }

        

    </style>
   
   

</head>
<body>
    <h3>this is borders </h3>
    <p id="firstpara">this is a first paragraph</p>
    <br>
    <p id="secondpara">this is a second paragraph</p>
    <br>
    <p id="thirdpara">this is a third paragraph</p>

    
</body>
</html>
