<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id ="para"> Now time is : </p>

    <script>

       function timed (){
         let time = new Date();
         console.log(time);
        document.getElementById('para').innerHTML = time;
       }

       setInterval(timed, 1000);
    </script>
</body>
</html>
