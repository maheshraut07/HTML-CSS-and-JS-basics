<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javacript Dates</title>
</head>
<body>
    <div class="container">
        This is container
    </div>
    <script>
        console.log("This is date and time tutorial");
        let now = new Date();   // for accesing current time and date
        console.log(now)  
        
        let dt = new Date(1000);  // for accesing date after standard time( 1 jan 1970)
        console.log(dt);

        let newDate = new Date("2029-09-30");
        console.log(newDate);

        //let newDate = new Date(year,month,date,hours,minutes,seconds,milliseconds);
        let newD = new Date(3020, 4, 6, 9, 3, 2, 34 );
        console.log(new Date);

        let yr = newD.getFullYear();
        console.log("The year is :",yr)

        let date = newD.getDate();
        console.log("The date is :",date)

        newD.setDate(39); //it will give miliseconds count after newD
        newD.setMinutes(29);
        console.log(newD);
        
        setInterval(updateTime, 1000);

        function updateTime(){
            innerHTML = new Date();
        }


    </script>
    
</body>
</html>
