<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes and animation </title>
</head>
<style>
    .container {
        background-color: greenyellow;
    }

    .box {
        background-color: green;
        padding: 20px;
        width: 250px;
        height: 250px;
        position: relative;
        animation-name: mahi;
        animation-duration: 1s;
        animation-iteration-count: 5;
        /* animation: animation name, animation -duration time , animation timing function ,
         animation delay, animation iteration count, animation fill mode*/
    }

    @keyframes mahi {
        from {
            width: 200px;
        }

        to {
            width: 500px;
        }
    }
</style>

<body>
    <div class="container">
        <div class="box">my name is mahesh</div>
    </div>
</body>

</html>
