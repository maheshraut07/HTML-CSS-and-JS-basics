<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Transforms</title>
</head>
<style>
    .container{
        height: 80vh;
        background-color: burlywood;
        display: flex;
        justify-content: center;
        align-items: center;

    }
    .box{
        display: flex;
        align-items: center;
        justify-content: center;
        background: brown;
        border: 2px solid black;
        border-radius: 8px;
        height: 300px;
        width: 300px;
        transition: all 0.5s ease-in-out;
        
        
    }
    .box:hover{
        transform: rotate(360deg);
        border-radius: 50px;
        content: "my name is mahesh";
       
    }
</style>
<body>
    <div class="container">
        <div class="box">
            <p>this is my box</p>
        </div>
    </div>
    
</body>
</html>
